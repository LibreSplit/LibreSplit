name: Build

on:
    push:
    pull_request:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
            rpm_release:
                required: true
                type: string
            source_sha:
                required: true
                type: string

permissions: {}

jobs:
    build:
        name: Build (${{matrix.arch}})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-26.04
                    - arch: aarch64
                      runner: ubuntu-26.04-arm
        permissions:
            contents: read
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.source_sha }}

            - name: "Set release version"
              if: inputs.version != ''
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  # Replace pre-release version with semantic versioning
                  sed -i "s/version: 'pre-release'/version: '${VERSION}'/" meson.build
                  grep -Fq "version: '${VERSION}'" meson.build

            - name: "Install and cache C dependencies"
              uses: awalsh128/cache-apt-pkgs-action@latest
              with:
                  packages: >
                      meson
                      libgtk-4-dev
                      libx11-dev
                      libjansson-dev
                      libluajit-5.1-dev
                  version: 1.0

            - name: "Configure"
              run: meson setup build -Dbuildtype=release -Dprefix=/usr

            - name: "Build"
              run: meson compile -C build

            - name: Set Build number
              shell: bash
              run: echo "build_number=$(git rev-list HEAD --count)" >> $GITHUB_ENV

            - name: Compute git short sha
              shell: bash
              run: echo "git_short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Set artifact names
              id: artifacts
              env:
                  ARCH: ${{ matrix.arch }}
                  STABLE_RELEASE: ${{ inputs.version != '' }}
                  VERSION: ${{ inputs.version }}
              run: |
                  if [[ "${STABLE_RELEASE}" == "true" ]]; then
                    echo "standalone=LibreSplit-${VERSION}-standalone-x86_64" >> "${GITHUB_OUTPUT}"
                    echo "appimage=LibreSplit-${VERSION}-${ARCH}.AppImage" >> "${GITHUB_OUTPUT}"
                    echo "zsync=LibreSplit-${VERSION}-${ARCH}.AppImage.zsync" >> "${GITHUB_OUTPUT}"
                    echo "update_channel=latest" >> "${GITHUB_OUTPUT}"
                  else
                    echo "standalone=LibreSplit-${build_number}-${git_short_sha}-standalone" >> "${GITHUB_OUTPUT}"
                    echo "appimage=LibreSplit-${build_number}-${git_short_sha}-nightly-${ARCH}.AppImage" >> "${GITHUB_OUTPUT}"
                    echo "zsync=LibreSplit-nightly-${ARCH}.AppImage.zsync" >> "${GITHUB_OUTPUT}"
                    echo "update_channel=nightly" >> "${GITHUB_OUTPUT}"
                  fi

            - name: "Bundle extra files"
              run: |
                  rm -rf release
                  mkdir -p release
                  # Use meson install to stage the install tree for a relocatable release
                  meson install -C build --destdir=$(pwd)/release
                  # Include extra non-installed files
                  cp -r assets release/

            - name: "Create standalone archive"
              if: matrix.arch == 'x86_64'
              env:
                  STANDALONE_NAME: ${{ steps.artifacts.outputs.standalone }}
              run: cd release && zip -qr "../${STANDALONE_NAME}.zip" .

            - name: "Upload artifacts"
              if: matrix.arch == 'x86_64'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.artifacts.outputs.standalone }}
                  path: ${{ steps.artifacts.outputs.standalone }}.zip

            - name: "Install AppImage dependencies"
              run: |
                  sudo apt -y update
                  sudo apt -y install desktop-file-utils libluajit-5.1-dev zsync

            - name: "Prepare AppDir from release artifact"
              run: |
                  rm -rf AppDir
                  mkdir -p AppDir

                  if [ -d release ]; then
                    cp -a release/* AppDir/
                    rm -rf AppDir/assets
                  else
                    echo "release directory not found; listing files:" && ls -la
                    exit 1
                  fi

                  mkdir -p AppDir/usr/share/applications
                  cp assets/libresplit.desktop AppDir/
                  cp assets/libresplit.desktop AppDir/usr/share/applications/
                  sed -i 's/^Exec=.*/Exec=AppRun/' AppDir/libresplit.desktop
                  cp assets/appimage.sh AppDir/AppRun
                  cp assets/icons/libresplit-256.png AppDir/libresplit.png
                  chmod +x AppDir/AppRun
                  chmod +x AppDir/usr/bin/libresplit
                  chmod +x AppDir/usr/bin/libresplit-ctl

            - name: "Download linuxdeploy"
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  wget -O linuxdeploy-${ARCH}.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-${ARCH}.AppImage
                  wget -O linuxdeploy-plugin-appimage-${ARCH}.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/latest/download/linuxdeploy-plugin-appimage-${ARCH}.AppImage
                  chmod +x linuxdeploy-${ARCH}.AppImage
                  chmod +x linuxdeploy-plugin-appimage-${ARCH}.AppImage

            - name: "Create AppImage"
              env:
                  APPIMAGE_EXTRACT_AND_RUN: 1
                  APPIMAGE_NAME: ${{ steps.artifacts.outputs.appimage }}
                  ARCH: ${{ matrix.arch }}
                  UPDATE_CHANNEL: ${{ steps.artifacts.outputs.update_channel }}
                  ZSYNC_NAME: ${{ steps.artifacts.outputs.zsync }}
              run: |
                  LDAI_OUTPUT="${APPIMAGE_NAME}" \
                  LDAI_UPDATE_INFORMATION="gh-releases-zsync|${{ github.repository_owner }}|LibreSplit|${UPDATE_CHANNEL}|LibreSplit-*-${ARCH}.AppImage.zsync" \
                  "./linuxdeploy-${ARCH}.AppImage" --appdir AppDir --desktop-file AppDir/libresplit.desktop --icon-file AppDir/libresplit.png --output appimage
                  if [[ "${APPIMAGE_NAME}.zsync" != "${ZSYNC_NAME}" ]]; then
                    mv "${APPIMAGE_NAME}.zsync" "${ZSYNC_NAME}"
                  fi

            - name: "Verify AppImage"
              env:
                APPIMAGE_NAME: ${{ steps.artifacts.outputs.appimage }}
                ZSYNC_NAME: ${{ steps.artifacts.outputs.zsync }}
              run: |
                for file in "${APPIMAGE_NAME}" "${ZSYNC_NAME}"; do
                  if [[ ! -s "${file}" ]]; then
                    echo "::error::Required ${file} not found"
                    exit 1
                  fi
                done

            - name: "Upload AppImage"
              uses: actions/upload-artifact@v4
              with:
                  path: ${{ steps.artifacts.outputs.appimage }}
                  name: ${{ steps.artifacts.outputs.appimage }}
                  if-no-files-found: error

            - name: "Upload AppImage zsync"
              uses: actions/upload-artifact@v4
              with:
                  path: ${{ steps.artifacts.outputs.zsync }}
                  name: ${{ steps.artifacts.outputs.zsync }}
                  if-no-files-found: error

    rpm:
        if: inputs.version != ''
        name: Build RPM (${{ matrix.architecture }})
        runs-on: ${{ matrix.runner }}
        container: registry.fedoraproject.org/fedora:44
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - architecture: x86_64
                      runner: ubuntu-26.04
                    - architecture: aarch64
                      runner: ubuntu-26.04-arm
        env:
            RPM_RELEASE: ${{ inputs.rpm_release }}
            SOURCE_SHA: ${{ inputs.source_sha }}
            VERSION: ${{ inputs.version }}
        steps:
            - name: Install Fedora tooling
              run: >-
                  dnf install --assumeyes
                  dnf5-plugins
                  gh
                  git-core
                  rpm-build

            - name: Check out LibreSplit
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  path: source
                  persist-credentials: false
                  ref: main

            - name: Prepare RPM sources
              run: |
                  set -euo pipefail

                  rpm_topdir="${RUNNER_TEMP}/rpmbuild"
                  install -d \
                    "${rpm_topdir}/BUILD" \
                    "${rpm_topdir}/BUILDROOT" \
                    "${rpm_topdir}/RPMS" \
                    "${rpm_topdir}/SOURCES" \
                    "${rpm_topdir}/SPECS" \
                    "${rpm_topdir}/SRPMS"

                  git -C source archive \
                    --format=tar.gz \
                    --prefix="libresplit-${VERSION}/" \
                    --output="${rpm_topdir}/SOURCES/libresplit-${VERSION}.tar.gz" \
                    "${SOURCE_SHA}"

                  cp source/assets/rpm/libresplit.spec "${rpm_topdir}/SPECS/libresplit.spec"
                  cp \
                    source/assets/rpm/libresplit.repo \
                    source/assets/rpm/org.libresplit.LibreSplit.metainfo.xml \
                    "${rpm_topdir}/SOURCES/"

            - name: Install RPM build dependencies
              run: |
                  rpm_topdir="${RUNNER_TEMP}/rpmbuild"
                  dnf --assumeyes builddep \
                    -D "libresplit_version ${VERSION}" \
                    -D "libresplit_release ${RPM_RELEASE}" \
                    --spec "${rpm_topdir}/SPECS/libresplit.spec"

            - name: Build RPM
              run: |
                  rpm_topdir="${RUNNER_TEMP}/rpmbuild"
                  rpmbuild -bb \
                    --define "_topdir ${rpm_topdir}" \
                    --define "libresplit_version ${VERSION}" \
                    --define "libresplit_release ${RPM_RELEASE}" \
                    "${rpm_topdir}/SPECS/libresplit.spec"

            - name: Upload unsigned RPM
              env:
                  ARCHITECTURE: ${{ matrix.architecture }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  rpm_topdir="${RUNNER_TEMP}/rpmbuild"
                  built_rpm="${rpm_topdir}/RPMS/${ARCHITECTURE}/libresplit-${VERSION}-${RPM_RELEASE}.${ARCHITECTURE}.rpm"
                  unsigned_rpm="${RUNNER_TEMP}/libresplit-${VERSION}-${RPM_RELEASE}.${ARCHITECTURE}.unsigned.rpm"

                  cp "${built_rpm}" "${unsigned_rpm}"
                  gh release upload \
                    "v${VERSION}" \
                    "${unsigned_rpm}" \
                    --clobber \
                    --repo "${GITHUB_REPOSITORY}"

    create-nightly-release:
        name: "Upload nightly release"
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        concurrency:
            group: create-release
            cancel-in-progress: false
        if: |
            github.event_name == 'push' &&
            inputs.version == '' &&
            github.ref == 'refs/heads/main' &&
            github.repository == 'LibreSplit/LibreSplit'
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Download Artifacts
              uses: actions/download-artifact@v7

            - name: Get commit info
              run: |
                  echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
                  echo "BUILD_VARIABLE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
                  echo "LAST_COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

            - name: Get last committer
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  COMMITTER=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }} \
                  | jq -r '.commit.author.name')
                  echo "COMMITTER_NAME=$COMMITTER" >> $GITHUB_ENV

            - name: Prepare artifacts
              run: |
                  mkdir -p artifacts-master
                  files=$(find . -maxdepth 1 -type d -name "LibreSplit-*")
                  printf "Found files:\n$files\n"
                  for f in $files; do
                    dir=$(basename $f)
                    if [[ $dir == *.AppImage ]]; then
                      echo "Processing $dir (AppImage)"
                      cp $dir/*.AppImage artifacts-master/
                    elif [[ $dir == *.AppImage.zsync ]]; then
                      echo "Processing $dir (AppImage zsync)"
                      cp $dir/*.AppImage.zsync artifacts-master/
                    elif [[ $dir == *-standalone ]]; then
                      echo "Processing $dir (Standalone x86_64)"
                      cp "$dir/$dir.zip" artifacts-master/
                    fi
                  done
                  echo "=== artifacts-master ==="
                  ls -al artifacts-master/

            - name: Download ghr
              run: |
                  wget -c https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz
                  tar xfv ghr_v0.17.0_linux_amd64.tar.gz

            - name: Upload to master repository
              run: |
                  ghr_v0.17.0_linux_amd64/ghr -u ${{ github.repository_owner }} -r LibreSplit -recreate -prerelease \
                    -n 'Automatic CI builds' \
                    -b "$(printf "Corresponding commit: ${{ github.sha }}\nLibreSplit Build: ${{ env.BUILD_VARIABLE }}")" \
                    nightly artifacts-master/
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
