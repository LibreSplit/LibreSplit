name: Build GTK
description: Build and cache the GTK toolchain

inputs:
    version:
        description: Exact GTK version used by the CI toolchain
        required: false
        default: 4.16.13
    sha256:
        description: SHA-256 checksum for the official GTK source archive
        required: false
        default: ddf3d9e12b848139a945d191d5ca56b78d0647f53b55b8bca5f9902b61624498

runs:
    using: composite
    steps:
        - name: Restore GTK cache
          id: gtk-cache
          uses: actions/cache/restore@v6
          with:
              path: ${{ runner.temp }}/gtk-prefix-${{ inputs.version }}
              key: >-
                  gtk-${{ inputs.version }}-${{ inputs.sha256 }}-ubuntu-${{ runner.arch }}-${{ hashFiles('.github/actions/build-gtk/action.yml') }}

        - name: Install required dependencies
          shell: bash
          run: |
              set -euo pipefail
              sudo apt-get update
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                  adwaita-icon-theme \
                  cpdb-backend-cups \
                  gir1.2-cairo-1.0-dev \
                  gir1.2-gdkpixbuf-2.0-dev \
                  gir1.2-gio-2.0-dev \
                  gir1.2-graphene-1.0-dev \
                  gir1.2-pango-1.0-dev \
                  gir1.2-pangocairo-1.0-dev \
                  gir1.2-xlib-2.0-dev \
                  hicolor-icon-theme \
                  iso-codes \
                  libcairo2-dev \
                  libcpdb2t64 \
                  libcpdb-frontend2t64 \
                  libegl1 \
                  libepoxy0 \
                  libgdk-pixbuf-2.0-dev \
                  libgles2 \
                  libglib2.0-dev \
                  libgraphene-1.0-dev \
                  libgstreamer-gl1.0-0 \
                  libgstreamer-plugins-bad1.0-0 \
                  libgstreamer-plugins-base1.0-0 \
                  libgstreamer1.0-0 \
                  libpango1.0-dev \
                  librsvg2-common \
                  libvulkan-dev \
                  libwayland-dev \
                  libx11-dev \
                  libxcursor1 \
                  libxdamage1 \
                  libxext6 \
                  libxfixes3 \
                  libxi6 \
                  libxinerama1 \
                  libxkbcommon0 \
                  libxrandr2 \
                  pkg-config \
                  shared-mime-info

        - name: Install GTK build dependencies
          if: steps.gtk-cache.outputs.cache-hit != 'true'
          shell: bash
          run: |
              set -euo pipefail
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                  build-essential \
                  ca-certificates \
                  curl \
                  gettext \
                  gobject-introspection \
                  glslc \
                  libcolord-dev \
                  libcloudproviders-dev \
                  libcpdb-dev \
                  libcpdb-frontend-dev \
                  libdrm-dev \
                  libegl1-mesa-dev \
                  libepoxy-dev \
                  libfontconfig-dev \
                  libfribidi-dev \
                  libgstreamer-plugins-bad1.0-dev \
                  libgstreamer-plugins-base1.0-dev \
                  libgstreamer1.0-dev \
                  libharfbuzz-dev \
                  libjpeg-dev \
                  libpng-dev \
                  libpolkit-gobject-1-dev \
                  librsvg2-dev \
                  libsysprof-capture-4-dev \
                  libtiff-dev \
                  libxcomposite-dev \
                  libxcursor-dev \
                  libxdamage-dev \
                  libxext-dev \
                  libxfixes-dev \
                  libxi-dev \
                  libxinerama-dev \
                  libxkbcommon-dev \
                  libxkbfile-dev \
                  libxrandr-dev \
                  libxml2-utils \
                  meson \
                  ninja-build \
                  sassc \
                  wayland-protocols \
                  xz-utils

              pkg-config --atleast-version=1.36 wayland-protocols

        - name: Build GTK
          if: steps.gtk-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              GTK_SHA256: ${{ inputs.sha256 }}
              GTK_VERSION: ${{ inputs.version }}
          run: |
              set -euo pipefail

              archive="${RUNNER_TEMP}/gtk-${GTK_VERSION}.tar.xz"
              source_dir="${RUNNER_TEMP}/gtk-${GTK_VERSION}"
              build_dir="${RUNNER_TEMP}/gtk-build-${GTK_VERSION}"
              prefix="${RUNNER_TEMP}/gtk-prefix-${GTK_VERSION}"

              series="${GTK_VERSION%.*}"

              curl --fail --location --silent --show-error \
                  --output "${archive}" \
                  "https://download.gnome.org/sources/gtk/${series}/gtk-${GTK_VERSION}.tar.xz"
              printf '%s  %s\n' "${GTK_SHA256}" "${archive}" | sha256sum --check --strict
              tar --extract --file "${archive}" --directory "${RUNNER_TEMP}"

              export DEB_LDFLAGS_MAINT_APPEND="-Wl,-z,defs -Wl,-O1"
              export CFLAGS="$(dpkg-buildflags --get CFLAGS)"
              export CPPFLAGS="$(dpkg-buildflags --get CPPFLAGS)"
              export LDFLAGS="$(dpkg-buildflags --get LDFLAGS)"

              meson setup "${build_dir}" "${source_dir}" \
                  --prefix "${prefix}" \
                  --libdir lib \
                  --buildtype plain \
                  --wrap-mode nofallback \
                  -Dstrip=true \
                  -Dauto_features=enabled \
                  -Dbroadway-backend=true \
                  -Dx11-backend=true \
                  -Dwayland-backend=true \
                  -Dvulkan=enabled \
                  -Dmedia-gstreamer=enabled \
                  -Dprint-cpdb=enabled \
                  -Dprint-cups=disabled \
                  -Dcolord=enabled \
                  -Dcloudproviders=disabled \
                  -Dsysprof=enabled \
                  -Dintrospection=enabled \
                  -Ddocumentation=false \
                  -Dman-pages=false \
                  -Dbuild-demos=false \
                  -Dbuild-examples=false \
                  -Dbuild-tests=false \
                  -Dbuild-testsuite=false
              meson compile -C "${build_dir}"
              meson install -C "${build_dir}"

        - name: Select GTK version
          shell: bash
          env:
              GTK_VERSION: ${{ inputs.version }}
          run: |
              set -euo pipefail

              prefix="${RUNNER_TEMP}/gtk-prefix-${GTK_VERSION}"
              pkg_config_path="${prefix}/lib/pkgconfig"
              library_path="${prefix}/lib"
              gir_path="${prefix}/share/gir-1.0"
              typelib_path="${prefix}/lib/girepository-1.0"

              if [[ -n "${PKG_CONFIG_PATH:-}" ]]; then
                  pkg_config_path="${pkg_config_path}:${PKG_CONFIG_PATH}"
              fi
              if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then
                  library_path="${library_path}:${LD_LIBRARY_PATH}"
              fi
              if [[ -n "${GI_GIR_PATH:-}" ]]; then
                  gir_path="${gir_path}:${GI_GIR_PATH}"
              fi
              if [[ -n "${GI_TYPELIB_PATH:-}" ]]; then
                  typelib_path="${typelib_path}:${GI_TYPELIB_PATH}"
              fi

              printf 'GTK_PREFIX=%s\n' "${prefix}" >> "${GITHUB_ENV}"
              printf 'PKG_CONFIG_PATH=%s\n' "${pkg_config_path}" >> "${GITHUB_ENV}"
              printf 'LD_LIBRARY_PATH=%s\n' "${library_path}" >> "${GITHUB_ENV}"
              printf 'GI_GIR_PATH=%s\n' "${gir_path}" >> "${GITHUB_ENV}"
              printf 'GI_TYPELIB_PATH=%s\n' "${typelib_path}" >> "${GITHUB_ENV}"
              printf 'XDG_DATA_DIRS=%s/share:%s\n' \
                  "${prefix}" \
                  "${XDG_DATA_DIRS:-/usr/local/share:/usr/share}" >> "${GITHUB_ENV}"
              printf '%s/bin\n' "${prefix}" >> "${GITHUB_PATH}"

              for module in gtk4 gtk4-broadway gtk4-wayland gtk4-x11; do
                  actual_version="$(PKG_CONFIG_PATH="${pkg_config_path}" pkg-config --modversion "${module}")"
                  if [[ "${actual_version}" != "${GTK_VERSION}" ]]; then
                      echo "Expected ${module} ${GTK_VERSION}, found ${actual_version}." >&2
                      exit 1
                  fi
              done

        - name: Save GTK cache
          if: steps.gtk-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@v6
          with:
              path: ${{ runner.temp }}/gtk-prefix-${{ inputs.version }}
              key: ${{ steps.gtk-cache.outputs.cache-primary-key }}
