on:
    push:
        branches: [master, main]
        paths:
            - docs/**
            - .github/workflows/publish-wiki.yml

concurrency:
    group: publish-wiki
    cancel-in-progress: true
permissions:
    contents: write

jobs:
    publish-wiki:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: Andrew-Chen-Wang/github-wiki-action@v5
              with:
                  path: docs/
